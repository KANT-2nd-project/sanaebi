[project]
name = "sanaebi"
version = "0.1.0"
description = "이음웍스 사내비 프로젝트 개발 환경"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
