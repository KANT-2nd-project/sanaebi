[project]
name = "sanaebi"
version = "0.1.0"
description = "이음웍스 사내비 프로젝트 개발 환경"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.1",
    "pydantic>=2.14.0",
    "mlflow>=3.17.1",
    "openai>=3.29.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
]

[project.scripts]
sanaebi = "archive.classification_v1.cli.main:main"
sanaebi-train = "archive.classification_v1.cli.train:main"

[project.optional-dependencies]
ollama = [
    "langchain-ollama>=1.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["classification*", "contracts*", "archive", "archive.classification_v1*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.uv]
package = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
