[project]
name = "sanaebi"
version = "0.1.0"
description = "이음웍스 사내비 프로젝트 개발 환경"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.1",
    "langchain-ollama>=1.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
