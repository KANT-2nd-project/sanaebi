name: Delivery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this verified main revision
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.5'
          python-version: '3.12.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m unittest discover -s tests -v
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build
      - run: |
          test -f web/out/index.html
          test -f web/out/chat.html
          test -f web/out/admin/documents.html
          test -f web/out/404.html
          tar -czf web.tar.gz -C web/out .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-${{ github.sha }}
          path: web.tar.gz
          retention-days: 14
  image:
    needs: [python, web]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          file: deployment/Dockerfile.api
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          load: true
          tags: ghcr.io/kant-2nd-project/sanaebi-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/KANT-2nd-project/sanaebi
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime imports and CPU backend
        env:
          IMAGE: ghcr.io/kant-2nd-project/sanaebi-api:${{ github.sha }}
        run: |
          docker run --rm --network none "$IMAGE" python -c 'import app.fastapi_main, torch; assert torch.version.cuda is None'
          docker run --rm --network none "$IMAGE" python scripts/deployment_model.py --help
  deploy:
    needs: [image, web]
    if: github.ref == 'refs/heads/main' && (inputs.deploy == true || (github.event_name == 'push' && vars.ENABLE_AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: sanaebi-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject superseded main revisions
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-${{ github.sha }}
          path: release
      - name: Package release
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: python scripts/package_release.py --directory release --git-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --image-digest "$IMAGE_DIGEST"
      - name: Configure pinned SSH identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_id="$GITHUB_SHA-$GITHUB_RUN_ID"
          ssh -o BatchMode=yes "deploy@$DEPLOY_HOST" "mkdir -p /srv/sanaebi/incoming/releases/$release_id"
          scp release/* "deploy@$DEPLOY_HOST:/srv/sanaebi/incoming/releases/$release_id/"
          trap 'ssh -o BatchMode=yes "deploy@$DEPLOY_HOST" sudo /usr/local/sbin/sanaebi-registry-auth logout || true' EXIT
          printf '%s' "$REGISTRY_TOKEN" | ssh -o BatchMode=yes "deploy@$DEPLOY_HOST" sudo /usr/local/sbin/sanaebi-registry-auth login
          ssh -o BatchMode=yes "deploy@$DEPLOY_HOST" sudo /usr/local/sbin/sanaebi-deploy deploy "$release_id"
          ssh -o BatchMode=yes "deploy@$DEPLOY_HOST" sudo /usr/local/sbin/sanaebi-activate-nginx
      - name: Public HTTPS smoke
        run: |
          curl --fail --silent --show-error https://sanaebi.29232923.xyz/chat > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://sanaebi.29232923.xyz/api/docs)" = 404
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
