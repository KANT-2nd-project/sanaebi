server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name 29232923.xyz sanaebi.29232923.xyz 129.225.142.54;
    include /etc/nginx/snippets/sanaebi-acme.conf;
    location / { return 301 https://sanaebi.29232923.xyz$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 29232923.xyz;
    include /etc/nginx/snippets/sanaebi-tls.conf;
    include /etc/nginx/snippets/sanaebi-acme.conf;
    location / { return 301 https://sanaebi.29232923.xyz$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sanaebi.29232923.xyz;
    include /etc/nginx/snippets/sanaebi-tls.conf;
    include /etc/nginx/snippets/sanaebi-acme.conf;
