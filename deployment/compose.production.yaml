name: sanaebi

services:
  api:
    image: ${SANAEBI_IMAGE:?SANAEBI_IMAGE must be set to a digest-pinned image}
    container_name: sanaebi-api
    user: "10001:10001"
    init: true
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 240s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    env_file:
      - /etc/sanaebi/api.env
    environment:
      SANAEBI_PUBLIC_DEMO: "1"
      SANAEBI_GENERATION_BUDGET_DB: /data/generation-budget.sqlite3
      SANAEBI_DAILY_GENERATION_LIMIT: "1000"
      SANAEBI_DOCUMENT_DB: /data/documents.sqlite3
      SANAEBI_CLASSIFIER_PATH: /models/classifier
      SANAEBI_RETRIEVAL_MODE: ${SANAEBI_RETRIEVAL_MODE:-full}
      SANAEBI_RETRIEVAL_ROOT: /data/retrieval
      SANAEBI_EMBEDDING_PATH: ${SANAEBI_EMBEDDING_PATH:-/models/embeddings/exp-models--dragonkue-KoEn-E5-Tiny/292c09c78c71a3f00ed56ee0d1ed9f0d39182fc9}
      TRACE_DIR: ""
      TRACE_FULL_PROMPT: "0"
    volumes:
      - type: bind
        source: /var/lib/sanaebi/runtime
        target: /data
      - type: bind
        source: /srv/sanaebi/models/current
        target: /models/classifier
        read_only: true
      - type: bind
        source: /srv/sanaebi/embeddings
        target: /models/embeddings
        read_only: true
    command:
      - python
      - -m
      - uvicorn
      - app.fastapi_main:app
      - --host
      - 127.0.0.1
      - --port
      - "18000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips
      - 127.0.0.1
      - --no-access-log
      - --timeout-graceful-shutdown
      - "240"

  retrieval-indexer:
    profiles: [rag]
    image: ${SANAEBI_IMAGE:?SANAEBI_IMAGE must be set to a digest-pinned image}
    container_name: sanaebi-retrieval-indexer
    user: "10001:10001"
    init: true
    network_mode: none
    restart: unless-stopped
    stop_grace_period: 240s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    environment:
      SANAEBI_RETRIEVAL_MODE: ${SANAEBI_RETRIEVAL_MODE:-full}
      SANAEBI_DOCUMENT_DB: /data/documents.sqlite3
      SANAEBI_RETRIEVAL_ROOT: /data/retrieval
      SANAEBI_EMBEDDING_PATH: ${SANAEBI_EMBEDDING_PATH:-/models/embeddings/exp-models--dragonkue-KoEn-E5-Tiny/292c09c78c71a3f00ed56ee0d1ed9f0d39182fc9}
      SANAEBI_RETRIEVAL_BASELINE: /retrieval-baseline/baseline.sqlite3
      SANAEBI_RETRIEVAL_SOURCE: /retrieval-source/documents.jsonl
      SANAEBI_RETRIEVAL_BUNDLE_HOST_PATH: ${SANAEBI_RETRIEVAL_BUNDLE_HOST_PATH:-/srv/sanaebi/retrieval-baselines/not-ready.sqlite3}
      SANAEBI_RETRIEVAL_SOURCE_HOST_PATH: ${SANAEBI_RETRIEVAL_SOURCE_HOST_PATH:-/var/lib/sanaebi/baseline/documents.jsonl}
    volumes:
      - type: bind
        source: /var/lib/sanaebi/runtime
        target: /data
      - type: bind
        source: /srv/sanaebi/embeddings
        target: /models/embeddings
        read_only: true
      - type: bind
        source: ${SANAEBI_RETRIEVAL_BUNDLE_HOST_PATH:-/srv/sanaebi/retrieval-baselines/not-ready.sqlite3}
        target: /retrieval-baseline/baseline.sqlite3
        read_only: true
      - type: bind
        source: ${SANAEBI_RETRIEVAL_SOURCE_HOST_PATH:-/var/lib/sanaebi/baseline/documents.jsonl}
        target: /retrieval-source/documents.jsonl
        read_only: true
    command:
      - python
      - -m
      - scripts.index_documents
      - --watch
