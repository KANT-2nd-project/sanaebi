# Installed inside the existing sanaebi HTTPS server block.
root /srv/sanaebi/current/web;
index index.html;
# Generation metadata is recorded by the API; do not retain arbitrary URL queries.
access_log off;
if (-f /srv/sanaebi/maintenance) { return 503; }
error_page 503 = @maintenance;
location @maintenance {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
    return 503 '{"ok":false,"text":"","reason":"서비스 업데이트 중입니다. 잠시 후 다시 시도해주세요."}';
}
location = /healthz { return 404; }
location = /api/ask {
    limit_except POST { deny all; }
    client_max_body_size 16k;
    include /etc/nginx/snippets/sanaebi-api.conf;
    proxy_pass http://127.0.0.1:18000/ask;
}
location ~ ^/api/documents(?:/|$) {
    client_max_body_size 512k;
    include /etc/nginx/snippets/sanaebi-api.conf;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18000;
}
location /api/ { return 404; }
location = /api { return 404; }
location = /admin/documents/ { return 308 /admin/documents$is_args$args; }
location = /chat/ { return 308 /chat$is_args$args; }
location ^~ /_next/static/ {
    root /srv/sanaebi/assets;
    try_files $uri =404;
    include /etc/nginx/snippets/sanaebi-response-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location / {
    try_files $uri.html $uri $uri/ =404;
    include /etc/nginx/snippets/sanaebi-response-headers.conf;
    add_header Cache-Control "no-cache" always;
    error_page 404 /404.html;
}
location = /404.html { internal; }
