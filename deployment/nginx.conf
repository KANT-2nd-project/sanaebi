# scripts/local_nginx.py가 @@...@@ 경로/포트를 채워 tmp/nginx에 저장합니다.
# /etc/nginx/nginx.conf에 복사하거나 직접 nginx -c로 실행하지 않습니다.
daemon off;
worker_processes 1;
worker_shutdown_timeout 5s;
pid nginx.pid;
error_log error.log warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    # 쿼리·본문·인증 정보는 access log에 기록하지 않습니다.
    log_format local '$time_iso8601 $request_method $uri $status $request_time';
    access_log access.log local;
    client_body_temp_path client_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;

    server {
        listen 127.0.0.1:@@PORT@@;
        server_name localhost;
        root "@@OUT_DIR@@";
        index index.html;
        add_header Cache-Control "no-cache" always;

        location = /api {
            add_header Cache-Control "no-store" always;
            return 404;
        }
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:@@UPSTREAM_PORT@@/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header Cache-Control "no-store" always;
        }
        location = /chat {
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 308 /chat/$is_args$args;
        }
        location ^~ /chat/ {
            proxy_pass http://127.0.0.1:@@UPSTREAM_PORT@@;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header X-Robots-Tag;
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location ^~ /_next/static/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            # 정적 소개 페이지와 Next 자산만 파일에서 제공합니다.
            try_files $uri.html $uri $uri/ =404;
            error_page 404 /404.html;
        }
        location = /404.html {
            internal;
        }
    }
}
